[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdl-speech-commands"
version = "0.1.0"
description = "Reproducible 12-class keyword spotting on Google Speech Commands v0.01"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Foundations of Deep Learning project group" },
]
dependencies = [
  "librosa==1.0.0",
  "matplotlib==3.10.6",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "pyyaml==6.0.2",
  "requests==2.32.5",
  "rich==14.1.0",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "seaborn==0.13.2",
  "soundfile==0.13.1",
  "tensorboard>=2.21.0",
  "tensorflow==2.21.0",
  "typer==0.16.1",
]

[project.optional-dependencies]
dev = [
  "ipykernel==6.30.1",
  "nbformat==5.10.4",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[project.scripts]
fdl-speech = "fdl_speech_commands.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fdl_speech_commands"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["data: requires the downloaded Speech Commands dataset"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
