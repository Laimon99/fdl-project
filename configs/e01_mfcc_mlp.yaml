experiment:
  id: e01_mfcc_mlp
  seed: 42
data:
  manifest: data/processed/manifest.csv
  raw_dir: data/raw/speech_commands_v0.01
features:
  kind: mfcc
  sample_rate: 16000
  clip_samples: 16000
  frame_length: 480
  frame_step: 160
  fft_length: 512
  mel_bins: 40
  mfcc_bins: 13
model:
  name: mlp
  dropout: 0.35
training:
  batch_size: 128
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 7
  augment: false

